</div>

const $=id=>document.getElementById(id);

let topicIndex=Number(localStorage.getItem("aptisTopic")||0);
let selected=null;
let dragged=null;
let soundOn=true;
let checked=false;

let saved={};

  saved=JSON.parse(localStorage.getItem("aptisProgress")||"{}");
}catch(error){
  saved={};
}

const orders={};

function shuffled(){
  const array=[0,1,2,3,4];

  do{
    for(let i=array.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [array[i],array[j]]=[array[j],array[i]];
    }
  }while(array.every((value,index)=>value===index));

  return array;
}

topics.forEach((topic,index)=>{
  orders[index]=Array.isArray(saved[index]?.order) &&
                saved[index].order.length===5
    ? [...saved[index].order]
    : shuffled();
});

function save(){
  const data={};

  topics.forEach((topic,index)=>{
    data[index]={
      order:[...orders[index]],
      score:Number.isFinite(saved[index]?.score)
        ? saved[index].score
        : null
    };
  });

  localStorage.setItem("aptisProgress",JSON.stringify(data));
  localStorage.setItem("aptisTopic",String(topicIndex));
}

function getAudioContext(){
  if(!window.__audioContext){
    window.__audioContext=
      new (window.AudioContext||window.webkitAudioContext)();
  }

  return window.__audioContext;
}

function beep(type="click"){
  if(!soundOn)return;

  const context=getAudioContext();

  const sounds={
    click:[[420,.035]],
    correct:[[520,.08],[720,.1]],
    wrong:[[210,.12],[160,.14]],
    finish:[[440,.08],[660,.08],[880,.15]]
  };

  let start=context.currentTime;

  (sounds[type]||sounds.click).forEach(([frequency,duration],index)=>{
    const oscillator=context.createOscillator();
    const gain=context.createGain();

    oscillator.type=type==="wrong"?"sawtooth":"sine";
    oscillator.frequency.value=frequency;

    gain.gain.setValueAtTime(.001,start);
    gain.gain.exponentialRampToValueAtTime(.12,start+.01);
    gain.gain.exponentialRampToValueAtTime(.001,start+duration);

    oscillator.connect(gain).connect(context.destination);
    oscillator.start(start);
    oscillator.stop(start+duration+.02);

    start+=duration+(index?0:.025);
  });
}

function speak(text){
  if(!("speechSynthesis" in window)){
    return;
  }

  speechSynthesis.cancel();

  const utterance=new SpeechSynthesisUtterance(text);
  utterance.lang="en-GB";
  utterance.rate=Number($("speechRate").value);

  const voices=speechSynthesis.getVoices();

  utterance.voice=
    voices.find(voice=>voice.lang==="en-GB")||
    voices.find(voice=>voice.lang.startsWith("en"))||
    null;

  speechSynthesis.speak(utterance);
}

function escapeHTML(text){
  return text.replace(/[&<>"']/g,character=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  }[character]));
}

function escapeAttribute(text){
  return escapeHTML(text);
}

        ${index+1}
      </button>
    `;
  }).join("");

  document.querySelectorAll(".topic-pill").forEach(button=>{
    button.addEventListener("click",()=>{
      topicIndex=Number(button.dataset.topic);
      checked=false;
      selected=null;
      beep();
      render();
    });
  });

  document.querySelector(".topic-pill.active")
    ?.scrollIntoView({inline:"center",block:"nearest"});
}

function render(){
  const topic=topics[topicIndex];

  $("topicLabel").textContent=
    `Topic ${String(topicIndex+1).padStart(2,"0")} · APTIS Reading`;

  $("topicTitle").textContent=topic.title;
  $("topicNumber").textContent=String(topicIndex+1).padStart(2,"0");

  $("answerPanel").classList.remove("show");
  $("showAnswer").textContent="Answer";

  $("feedback").className="feedback";
  $("feedback").firstElementChild.textContent=
    "Arrange the five sentences into a logical paragraph.";

  $("progressBar").style.width="0%";

  $("cards").innerHTML=orders[topicIndex]
    .map((sentenceId,position)=>{
      const sentence=topic.sentences[sentenceId];

      return `
        <article
          class="card"
          draggable="true"
          data-id="${sentenceId}">

          <div class="number">${position+1}</div>

          <div class="sentence">
            ${escapeHTML(sentence)}
          </div>

          <button
            class="speak-one"
            type="button"
            aria-label="Read sentence"
            data-text="${escapeAttribute(sentence)}">
            🔊
          </button>
        </article>
      `;
    }).join("");

  bindCards();
  renderAnswer();
  renderPills();
  updateScore();
  save();
}

function bindCards(){
  document.querySelectorAll(".card").forEach(card=>{

    card.addEventListener("dragstart",()=>{
      dragged=Number(card.dataset.id);
      card.classList.add("dragging");
    });

    card.addEventListener("dragend",()=>{
      card.classList.remove("dragging");
    });

    card.addEventListener("dragover",event=>{
      event.preventDefault();
    });

    card.addEventListener("drop",event=>{
      event.preventDefault();
      swap(dragged,Number(card.dataset.id));
    });

    card.addEventListener("click",event=>{
      if(event.target.closest(".speak-one"))return;

      const id=Number(card.dataset.id);

      if(selected===null){
        selected=id;
        card.classList.add("selected");
        beep();
        return;
      }

      if(selected===id){
        selected=null;
        card.classList.remove("selected");
        return;
      }

      swap(selected,id);
      selected=null;
    });
  });

  document.querySelectorAll(".speak-one").forEach(button=>{
    button.addEventListener("click",event=>{
      event.stopPropagation();
      beep();
      speak(button.dataset.text);
    });
  });
}

function swap(firstId,secondId){
  if(firstId===null || firstId===secondId)return;

  const order=orders[topicIndex];
  const firstIndex=order.indexOf(firstId);
  const secondIndex=order.indexOf(secondId);

  [order[firstIndex],order[secondIndex]]=
    [order[secondIndex],order[firstIndex]];

  saved[topicIndex]={
    order:[...order],
    score:null
  };

  checked=false;
  selected=null;

  beep();
  render();
}

function renderAnswer(){
  $("answerContent").innerHTML=
    topics[topicIndex].sentences.map((sentence,index)=>`
      <div class="answer-row">
        <b>${index+1}</b>
        <span>${escapeHTML(sentence)}</span>
      </div>
    `).join("");
}

function checkAnswer(){
  checked=true;

  const order=orders[topicIndex];
  const cards=[...document.querySelectorAll(".card")];

  let score=0;

  cards.forEach((card,position)=>{
    const isCorrect=order[position]===position;

    if(isCorrect)score++;

    card.classList.add(isCorrect?"correct":"wrong");

    card.insertAdjacentHTML(
      "beforeend",
      `<div class="result-tag">
        ${isCorrect
          ?"✓ Correct position"
          :`✕ This sentence belongs in position ${order[position]+1}`}
      </div>`
    );
  });

  saved[topicIndex]={
    order:[...order],
    score
  };

  $("progressBar").style.width=`${score*20}%`;

  $("feedback").className=
    `feedback ${score===5?"success":"warning"}`;

  $("feedback").firstElementChild.textContent=
    score===5
      ?"Dossier complete — perfect order!"
      :`${score}/5 positions correct. Review the links between sentences.`;

  beep(score===5?"finish":score>0?"correct":"wrong");

  if(score===5){
    celebrate();
  }

  updateScore();
  renderPills();
  save();
}

function updateScore(){
  let total=0;

  topics.forEach((topic,index)=>{
    const score=saved[index]?.score;

    if(Number.isFinite(score)){
      total+=score;
    }
  });

  $("totalScore").textContent=`Score ${total}/110`;
  document.title=`APTIS ${total}/110 · 22 Topics`;
}

function celebrate(){
  const colors=[
    "#ff5c8a",
    "#ffd84d",
    "#66e6c4",
    "#75b9ff",
    "#ff6b66"
  ];

  $("confetti").innerHTML=
    Array.from({length:45},(item,index)=>`
      <i style="
        left:${Math.random()*100}%;
        background:${colors[index%colors.length]};
        animation-delay:${Math.random()*.45}s;
        transform:rotate(${Math.random()*180}deg)">
      </i>
    `).join("");

  setTimeout(()=>{
    $("confetti").innerHTML="";
  },2400);
}

$("check").addEventListener("click",()=>{
  checkAnswer();
});

$("shuffle").addEventListener("click",()=>{
  orders[topicIndex]=shuffled();

  saved[topicIndex]={
    order:[...orders[topicIndex]],
    score:null
  };

  checked=false;
  selected=null;

  beep();
  render();
});

$("clearCurrent").addEventListener("click",()=>{
  speechSynthesis.cancel();

  saved[topicIndex]={
    order:[...orders[topicIndex]],
    score:null
  };

  checked=false;
  selected=null;

  $("answerPanel").classList.remove("show");
  $("showAnswer").textContent="Answer";

  beep("click");
  render();

  $("feedback").className="feedback";
  $("feedback").firstElementChild.textContent=
    "Current result cleared. Your sentence order has been kept.";
});

$("resetAll").addEventListener("click",()=>{
  speechSynthesis.cancel();

  topics.forEach((topic,index)=>{
    orders[index]=shuffled();
  });

  saved={};

  localStorage.removeItem("aptisProgress");
  localStorage.removeItem("aptisTopic");

  topicIndex=0;
  selected=null;
  dragged=null;
  checked=false;

  $("answerPanel").classList.remove("show");
  $("showAnswer").textContent="Answer";

  beep("wrong");
  render();

  $("feedback").className="feedback warning";
  $("feedback").firstElementChild.textContent=
    "All 22 topics have been reset. Start again from Topic 1.";
});

$("showAnswer").addEventListener("click",()=>{
  const panel=$("answerPanel");

  panel.classList.toggle("show");

  $("showAnswer").textContent=
    panel.classList.contains("show")
      ?"Hide answer"
      :"Answer";

  beep();
});

$("previous").addEventListener("click",()=>{
  topicIndex=(topicIndex-1+topics.length)%topics.length;
  checked=false;
  selected=null;
  beep();
  render();
});

$("next").addEventListener("click",()=>{
  topicIndex=(topicIndex+1)%topics.length;
  checked=false;
  selected=null;
  beep();
  render();
});

$("readAll").addEventListener("click",()=>{
  beep();
  speak(topics[topicIndex].sentences.join(" "));
});

$("stopAudio").addEventListener("click",()=>{
  speechSynthesis.cancel();
  beep();
});

$("soundToggle").addEventListener("click",()=>{
  soundOn=!soundOn;

  $("soundToggle").textContent=
    soundOn
      ?"🔊 Sound"
      :"🔇 Muted";

  if(soundOn){
    beep();
  }
});

window.addEventListener("keydown",event=>{
  if(event.key==="ArrowRight"){
    $("next").click();
  }

  if(event.key==="ArrowLeft"){
    $("previous").click();
  }

  if(
    event.key==="Enter" &&
    !event.target.matches("button,select")
  ){
    checkAnswer();
  }
});

render();
</script>
</body>
</html>
